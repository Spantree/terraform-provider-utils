apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: data-processing-workflow
  namespace: @@NAMESPACE@@
  labels:
    app: data-processor
    managed-by: terraform
spec:
  entrypoint: main

  # Workflow-level parameters that can be overridden at runtime
  arguments:
    parameters:
      - name: start-date
        value: "@@START_DATE@@"
      - name: end-date
        value: "@@END_DATE@@"
      - name: batch-size
        value: "1000"

  # Volume claim template for shared storage
  volumeClaimTemplates:
    - metadata:
        name: workdir
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi

  templates:
    # Main workflow orchestration
    - name: main
      steps:
        - - name: validate-inputs
            template: validate
            arguments:
              parameters:
                - name: start-date
                  value: "{{workflow.parameters.start-date}}"
                - name: end-date
                  value: "{{workflow.parameters.end-date}}"

        - - name: process-data
            template: processor
            arguments:
              parameters:
                - name: start-date
                  value: "{{workflow.parameters.start-date}}"
                - name: end-date
                  value: "{{workflow.parameters.end-date}}"
                - name: batch-size
                  value: "{{workflow.parameters.batch-size}}"

        - - name: generate-report
            template: report
            arguments:
              parameters:
                - name: processing-status
                  value: "{{steps.process-data.outputs.result}}"

    # Input validation step
    - name: validate
      inputs:
        parameters:
          - name: start-date
          - name: end-date
      container:
        image: @@IMAGE_REPOSITORY@@:@@IMAGE_TAG@@
        command: [python, -c]
        args:
          - |
            from datetime import datetime

            start = "{{inputs.parameters.start-date}}"
            end = "{{inputs.parameters.end-date}}"

            start_dt = datetime.strptime(start, "%Y-%m-%d")
            end_dt = datetime.strptime(end, "%Y-%m-%d")

            if start_dt > end_dt:
                raise ValueError(f"Start date {start} is after end date {end}")

            print(f"Date range validated: {start} to {end}")

    # Data processing step
    - name: processor
      inputs:
        parameters:
          - name: start-date
          - name: end-date
          - name: batch-size
      outputs:
        parameters:
          - name: records-processed
            valueFrom:
              path: /tmp/output.txt
      container:
        image: @@IMAGE_REPOSITORY@@:@@IMAGE_TAG@@
        command: [sh, -c]
        args:
          - |
            #!/bin/bash
            set -e

            # These are Argo parameters, evaluated at runtime
            START_DATE="{{inputs.parameters.start-date}}"
            END_DATE="{{inputs.parameters.end-date}}"
            BATCH_SIZE="{{inputs.parameters.batch-size}}"

            echo "Processing data from $START_DATE to $END_DATE"
            echo "Batch size: $BATCH_SIZE"

            # Simulate processing
            RECORDS=$((RANDOM % 10000 + 1000))
            echo "Processed $RECORDS records"
            echo "$RECORDS" > /tmp/output.txt

            # Shell arithmetic works fine
            BATCHES=$((RECORDS / BATCH_SIZE))
            echo "Total batches: $BATCHES"

            # Bash conditionals work fine
            if [[ $RECORDS -gt 5000 ]]; then
              echo "Large dataset processed"
            else
              echo "Small dataset processed"
            fi
        volumeMounts:
          - name: workdir
            mountPath: /data
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"

    # Report generation step
    - name: report
      inputs:
        parameters:
          - name: processing-status
      container:
        image: @@IMAGE_REPOSITORY@@:@@IMAGE_TAG@@
        command: [python, -c]
        args:
          - |
            import json
            from datetime import datetime

            status = "{{inputs.parameters.processing-status}}"

            report = {
                "timestamp": datetime.utcnow().isoformat(),
                "records_processed": int(status),
                "status": "success",
                "workflow": "{{workflow.name}}",
                "namespace": "@@NAMESPACE@@"
            }

            print(json.dumps(report, indent=2))
        volumeMounts:
          - name: workdir
            mountPath: /data
